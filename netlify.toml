[build]
  base = "web"
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Os valores NEXT_PUBLIC_ sao expostos ao navegador por design.
  # JVG_SUPABASE_URL e uma variavel publica antiga ainda presente em algumas contas Netlify.
  # A chave JVG_SUPABASE_SECRET_KEY continua sujeita a verificacao de segredos.
  SECRETS_SCAN_OMIT_KEYS = "JVG_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"

# O repositorio tambem contem ferramentas antigas de Vite/Cloudflare.
# Ativar o adaptador Next.js explicitamente impede deploy estatico da pasta .next.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Configure as chaves no painel da Netlify, nunca neste arquivo.
